- name: Assemble combined output directory
        run: |
          set -e
          rm -rf out_comb
          cp -a work/built out_comb
          # keep built_vendor_boot.img in place — magiskboot repack needs it as the header template

          REF_PLATFORM=""
          for cand in work/ref/vendor_ramdisk/ramdisk.cpio work/ref/ramdisk.cpio; do
            [ -f "$cand" ] && REF_PLATFORM="$cand" && break
          done
          if [ -z "$REF_PLATFORM" ]; then
            echo "::error::No platform ramdisk.cpio found in unpacked reference image"
            find work/ref -type f
            exit 1
          fi

          if [ -d out_comb/vendor_ramdisk ]; then
            DEST_PLATFORM="out_comb/vendor_ramdisk/ramdisk.cpio"
          else
            mkdir -p out_comb/vendor_ramdisk
            DEST_PLATFORM="out_comb/vendor_ramdisk/ramdisk.cpio"
          fi
          cp -f "$REF_PLATFORM" "$DEST_PLATFORM"
          echo "Copied platform ramdisk from reference -> $DEST_PLATFORM ($(stat -c%s "$DEST_PLATFORM") bytes)"

          BUILT_RECOVERY=""
          for cand in out_comb/vendor_ramdisk/recovery.cpio out_comb/recovery.cpio; do
            [ -f "$cand" ] && BUILT_RECOVERY="$cand" && break
          done
          if [ -z "$BUILT_RECOVERY" ]; then
            echo "::error::No recovery.cpio found in the built image output"
            find out_comb -type f
            exit 1
          fi
          echo "Keeping recovery ramdisk from built: $BUILT_RECOVERY ($(stat -c%s "$BUILT_RECOVERY") bytes)"

          if [ -f work/built/dtb ] && [ "$(stat -c%s work/built/dtb)" -gt 0 ]; then
            cp -f work/built/dtb out_comb/dtb
            echo "DTB: keeping built image's dtb ($(stat -c%s out_comb/dtb) bytes)"
          elif [ -f work/ref/dtb ]; then
            cp -f work/ref/dtb out_comb/dtb
            echo "DTB: built dtb missing/empty, falling back to reference dtb"
          else
            echo "No dtb present in either image — continuing without one"
          fi

          echo "=== final combined directory ==="
          find out_comb -type f -exec ls -la {} \;

      - name: Repack
        run: |
          set -e
          cd out_comb
          test -f built_vendor_boot.img || { echo "::error::built_vendor_boot.img missing in out_comb — cannot repack"; exit 1; }
          magiskboot repack built_vendor_boot.img "$GITHUB_WORKSPACE/vendor_boot_fixed.img"
          cd "$GITHUB_WORKSPACE"
          test -f vendor_boot_fixed.img
          echo "repacked size: $(stat -c%s vendor_boot_fixed.img) bytes"
